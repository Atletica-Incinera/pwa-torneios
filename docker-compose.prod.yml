services:
  web:
    container_name: pwa-torneios-web
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_BASE_PATH=/intereng
      - NEXT_PUBLIC_API_URL=/intereng-api
    networks:
      - incinera-network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

networks:
  incinera-network:
    external: true
