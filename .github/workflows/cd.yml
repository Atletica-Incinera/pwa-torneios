name: CD Deploy Frontend Torneios

on:
  push:
    # `front-end` é a branch de produção deste repositório — `main` está atrás
    # dela. O gatilho listava as duas, mas o passo de deploy sempre publicava
    # `front-end`: um merge em `main` disparava o workflow, ele terminava verde
    # e reimplantava a branch antiga, sem nada indicando o motivo. Agora o
    # gatilho e o alvo são a mesma branch.
    branches:
      - front-end
    # Documentação e configuração de CI não justificam reconstruir a imagem e
    # reiniciar o site. Para publicar mesmo assim, use "Run workflow".
    paths-ignore:
      - '.github/**'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PWA Torneios to CIn VM
    runs-on: self-hosted

    steps:
      - name: Preparar código
        run: |
          set -euo pipefail
          PROJECT_DIR="$HOME/pwa-torneios"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          if [ ! -d "$PROJECT_DIR" ]; then
            git clone https://github.com/Atletica-Incinera/pwa-torneios.git "$PROJECT_DIR"
          fi

          cd "$PROJECT_DIR"
          git fetch --all
          git checkout front-end
          git reset --hard origin/front-end

          docker network inspect incinera-network >/dev/null 2>&1 || docker network create incinera-network

      # As NEXT_PUBLIC_* são embutidas no bundle do navegador durante o build,
      # e vêm de `build.args` no compose. Se alguém as mover de volta para
      # `environment:`, o site sobe com o endereço errado assado no bundle e o
      # sintoma só aparece no navegador do usuário. Falhar aqui é mais barato.
      - name: Conferir que as NEXT_PUBLIC_ são build args
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          faltando=""
          for var in NEXT_PUBLIC_DATA_SOURCE NEXT_PUBLIC_API_URL NEXT_PUBLIC_BASE_PATH; do
            docker compose -f docker-compose.prod.yml config \
              | grep -q "$var" || faltando="$faltando $var"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Ausentes do docker-compose.prod.yml:$faltando"
            exit 1
          fi
          echo "as três variáveis estão declaradas"

      - name: Construir e subir o site
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          docker image prune -f

      # O passo anterior devolve sucesso assim que o container inicia, mesmo que
      # o processo morra logo depois. Sem esta verificação o workflow escrevia
      # "finalizado com sucesso" enquanto o site estava fora do ar.
      - name: Verificar que o site respondeu
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          # O app é servido sob /intereng: a raiz devolve 404 por construção.
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T web \
                 wget -q --spider http://127.0.0.1:3001/intereng; then
              echo "site respondendo em /intereng"
              exit 0
            fi
            sleep 2
          done
          echo "::error::O site não respondeu em /intereng em 60s. Últimas linhas do log:"
          docker compose -f docker-compose.prod.yml logs --tail 50 web
          exit 1
