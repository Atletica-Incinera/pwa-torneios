# Ambiente local do InterEng.
#
# Este arquivo sobe a infraestrutura e o app. A API é outro repositório
# (Atletica-Incinera/intereng-api) e entra por um override, nunca por um
# checkout dentro desta árvore:
#
#   docker compose -f docker-compose.yml -f docker-compose.api.yml up   # API do fonte
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up  # API da imagem
#   docker compose -f docker-compose.yml -f docker-compose.host-api.yml up  # API fora do Docker
#
# O app fala com a API pelo mesmo host (`/api`), roteado pelo Traefik. Isso
# evita preflight de CORS e o cookie cross-site que `SameSite=Strict` recusa.
services:
  traefik:
    image: traefik:v3.1
    container_name: pwa-torneios-traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # SSE morre calado atrás de proxy que fecha escrita ociosa: o stream da
      # edição fica aberto por horas sem trafegar nada além do heartbeat.
      - --entrypoints.web.transport.respondingTimeouts.writeTimeout=0
      - --entrypoints.web.transport.respondingTimeouts.idleTimeout=600s
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pwa-torneios

  postgres:
    image: postgres:16-alpine
    container_name: pwa-torneios-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pwa_torneios}
      POSTGRES_USER: ${POSTGRES_USER:-pwa_torneios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pwa_torneios_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pwa_torneios} -d $${POSTGRES_DB:-pwa_torneios}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - pwa-torneios

  redis:
    image: redis:7-alpine
    container_name: pwa-torneios-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pwa-torneios

  web:
    container_name: pwa-torneios-web
    build:
      # O contexto é a raiz do workspace: o lockfile e os pacotes de
      # `packages/` ficam de fora se ele for `./apps/web`.
      context: .
      dockerfile: apps/web/Dockerfile
      # `NEXT_PUBLIC_*` é embutido na compilação: cada origem de dados é uma
      # imagem distinta. Trocar a variável num container de pé não faz nada.
      args:
        NEXT_PUBLIC_DATA_SOURCE: ${NEXT_PUBLIC_DATA_SOURCE:-local}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
        NEXT_PUBLIC_REALTIME: ${NEXT_PUBLIC_REALTIME:-sse}
        NEXT_PUBLIC_REALTIME_INTERVAL: ${NEXT_PUBLIC_REALTIME_INTERVAL:-5000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/public"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.pwa-torneios-web.rule=Host(`${WEB_HOST:-app.localhost}`)
      - traefik.http.routers.pwa-torneios-web.entrypoints=web
      - traefik.http.services.pwa-torneios-web.loadbalancer.server.port=3001
    networks:
      - pwa-torneios

volumes:
  postgres_data:
  redis_data:

networks:
  pwa-torneios:
    driver: bridge
